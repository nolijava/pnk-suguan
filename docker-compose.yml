services:
  db:
    image: postgres:16-alpine
    container_name: pnk-postgres
    environment:
      POSTGRES_DB: pnk
      POSTGRES_USER: pnk
      # Value is overridden in production; local-only convenience default.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pnk -d pnk"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
